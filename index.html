<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7dce7">
<title>For Ritumonnnn ♡</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#542c3d;
    background:#f7dce7;
}

/* =========================
   PAGE SYSTEM
========================= */

.page{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;

    display:none;
    align-items:center;
    justify-content:center;

    padding:18px;
    overflow-y:auto;
    overflow-x:hidden;

    text-align:center;

    background:
        radial-gradient(circle at 10% 8%,
            rgba(255,255,255,.95),
            transparent 28%),
        radial-gradient(circle at 90% 90%,
            rgba(220,190,255,.28),
            transparent 30%),
        linear-gradient(145deg,
            #fff8fb,
            #f7d8e5);

    z-index:5;
}

/* Home is the default screen */
#home{
    display:flex;
    z-index:1;
}

/* Any targeted page sits above Home */
.page:target{
    display:flex;
    z-index:20;
    animation:pageIn .55s ease both;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:scale(.985);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.container{
    position:relative;
    width:min(94%,560px);
    z-index:10;
}

.small{
    margin-bottom:12px;
    color:#96727f;
    font-size:10px;
    letter-spacing:4px;
    text-transform:uppercase;
}

h1,h2{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    color:#b52f62;
}

.subtitle{
    color:#765765;
    font-size:14px;
    line-height:1.7;
}

.next-button{
    display:inline-block;
    margin-top:20px;
    padding:14px 27px;

    border-radius:50px;

    background:linear-gradient(135deg,#c9366d,#a92057);
    color:white;

    font-size:14px;
    font-weight:bold;
    text-decoration:none;

    box-shadow:0 12px 28px rgba(165,40,91,.25);

    transition:.25s ease;
}

.next-button:active{
    transform:scale(.94);
}

/* =========================
   FLOATING HEARTS
========================= */

.ambient{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:2;
}

.heart{
    position:absolute;
    bottom:-50px;
    color:rgba(188,53,103,.20);
    animation:heartFloat linear infinite;
}

.heart:nth-child(1){
    left:5%;
    font-size:20px;
    animation-duration:12s;
}

.heart:nth-child(2){
    left:17%;
    font-size:13px;
    animation-duration:16s;
    animation-delay:3s;
}

.heart:nth-child(3){
    left:29%;
    font-size:25px;
    animation-duration:11s;
    animation-delay:5s;
}

.heart:nth-child(4){
    left:42%;
    font-size:15px;
    animation-duration:15s;
    animation-delay:1s;
}

.heart:nth-child(5){
    left:55%;
    font-size:24px;
    animation-duration:13s;
    animation-delay:6s;
}

.heart:nth-child(6){
    left:68%;
    font-size:14px;
    animation-duration:17s;
    animation-delay:2s;
}

.heart:nth-child(7){
    left:80%;
    font-size:22px;
    animation-duration:12s;
    animation-delay:7s;
}

.heart:nth-child(8){
    left:92%;
    font-size:17px;
    animation-duration:15s;
    animation-delay:4s;
}

@keyframes heartFloat{
    0%{
        opacity:0;
        transform:translateY(0) translateX(0) rotate(0);
    }

    15%{
        opacity:.5;
    }

    50%{
        transform:translateY(-55vh) translateX(18px) rotate(12deg);
    }

    100%{
        opacity:0;
        transform:translateY(-115vh) translateX(-12px) rotate(-15deg);
    }
}

/* =========================
   SPARKLES
========================= */

.sparkle{
    position:absolute;
    color:rgba(181,74,117,.25);
    animation:sparkle 3s ease-in-out infinite;
}

.s1{left:12%;top:24%}
.s2{right:13%;top:18%;animation-delay:1s}
.s3{right:23%;bottom:23%;animation-delay:1.8s}
.s4{left:20%;bottom:16%;animation-delay:2.3s}

@keyframes sparkle{
    0%,100%{
        opacity:.1;
        transform:scale(.7) rotate(0);
    }
    50%{
        opacity:.7;
        transform:scale(1.35) rotate(90deg);
    }
}

/* =========================
   TEDDY
========================= */

.teddy{
    position:absolute;
    width:100px;
    height:135px;
    left:50%;
    bottom:3px;
    transform:translateX(-50%) scale(.75);
    z-index:30;
    pointer-events:none;
    animation:teddyFloat 3s ease-in-out infinite;
}

@keyframes teddyFloat{
    0%,100%{
        transform:translateX(-50%) scale(.75) translateY(0);
    }
    50%{
        transform:translateX(-50%) scale(.75) translateY(-6px);
    }
}

.ear{
    position:absolute;
    width:36px;
    height:36px;
    top:3px;
    background:#b97958;
    border-radius:50%;
}

.ear.left{left:5px}
.ear.right{right:5px}

.ear:after{
    content:"";
    position:absolute;
    inset:8px;
    background:#e8ae98;
    border-radius:50%;
}

.teddy-head{
    position:absolute;
    width:82px;
    height:76px;
    left:9px;
    top:15px;
    background:#c48866;
    border-radius:48%;
}

.eye{
    position:absolute;
    width:7px;
    height:9px;
    top:28px;
    background:#3b2420;
    border-radius:50%;
    animation:blink 4.5s infinite;
}

.eye.left{left:24px}
.eye.right{right:24px}

@keyframes blink{
    0%,45%,48%,100%{transform:scaleY(1)}
    46%,47%{transform:scaleY(.1)}
}

.muzzle{
    position:absolute;
    width:37px;
    height:28px;
    left:22px;
    top:41px;
    background:#e8ae98;
    border-radius:50%;
}

.nose{
    position:absolute;
    width:11px;
    height:8px;
    left:13px;
    top:7px;
    background:#40251f;
    border-radius:50%;
}

.mouth{
    position:absolute;
    width:13px;
    height:6px;
    left:12px;
    top:14px;
    border-bottom:2px solid #40251f;
    border-radius:50%;
}

.teddy-body{
    position:absolute;
    width:70px;
    height:62px;
    left:15px;
    top:77px;
    background:#b97958;
    border-radius:45% 45% 35% 35%;
}

.belly{
    position:absolute;
    width:43px;
    height:38px;
    left:13px;
    top:10px;
    background:#e8ae98;
    border-radius:50%;
}

.teddy-heart{
    position:absolute;
    left:12px;
    top:7px;
    color:#d83d71;
    font-size:20px;
}

.arm{
    position:absolute;
    width:23px;
    height:42px;
    top:82px;
    background:#b97958;
    border-radius:50%;
}

.arm.left{
    left:-2px;
    transform:rotate(28deg);
}

.arm.right{
    right:-2px;
    transform:rotate(-28deg);
}

.foot{
    position:absolute;
    width:29px;
    height:19px;
    top:124px;
    background:#a96b50;
    border-radius:50%;
}

.foot.left{left:10px}
.foot.right{right:10px}

/* =========================
   HOME
========================= */

.name{
    margin:20px 0 7px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(68px,21vw,110px);
    line-height:.9;
    letter-spacing:-4px;
    color:#bd3167;
}

.age{
    margin-top:15px;
    font-size:20px;
    color:#633849;
}

/* =========================
   BALLOONS
========================= */

.balloon-heading{
    font-size:clamp(42px,12vw,62px);
    line-height:.95;
    margin-bottom:8px;
}

.balloon-stage{
    position:relative;
    width:100%;
    max-width:470px;
    height:390px;
    margin:4px auto 0;
}

.balloon{
    position:absolute;
    width:68px;
    height:88px;
    border-radius:50%;
    cursor:pointer;

    box-shadow:
        inset -10px -12px 18px rgba(0,0,0,.08),
        inset 9px 7px 14px rgba(255,255,255,.28),
        0 12px 25px rgba(80,30,50,.13);

    animation:balloonFloat var(--speed) ease-in-out infinite;
    transition:opacity .3s,transform .3s;
}

.balloon:before{
    content:"";
    position:absolute;
    width:14px;
    height:28px;
    left:11px;
    top:11px;
    background:rgba(255,255,255,.48);
    border-radius:50%;
    transform:rotate(24deg);
}

.balloon-knot{
    position:absolute;
    left:50%;
    bottom:-6px;
    width:11px;
    height:11px;
    transform:translateX(-50%) rotate(45deg);
    background:inherit;
}

.balloon-string{
    position:absolute;
    left:50%;
    top:86px;
    width:1px;
    height:88px;
    background:rgba(91,60,70,.4);
    transform-origin:top;
    animation:stringSway 2.2s ease-in-out infinite;
}

@keyframes stringSway{
    0%,100%{transform:rotate(-2deg)}
    50%{transform:rotate(3deg)}
}

.balloon1{
    left:6%;
    top:60px;
    background:#f47fa5;
    --speed:3.4s;
    animation-delay:-1s;
}

.balloon2{
    left:40%;
    top:8px;
    background:#a79cf4;
    --speed:4.1s;
    animation-delay:-2s;
}

.balloon3{
    right:6%;
    top:62px;
    background:#ffd05b;
    --speed:3.7s;
    animation-delay:-.5s;
}

.balloon4{
    left:20%;
    top:220px;
    background:#69cbbb;
    --speed:4.5s;
    animation-delay:-2.7s;
}

.balloon5{
    right:20%;
    top:225px;
    background:#ff9877;
    --speed:3.9s;
    animation-delay:-1.5s;
}

@keyframes balloonFloat{
    0%,100%{
        transform:translate(0,0) rotate(-2deg);
    }
    25%{
        transform:translate(7px,-13px) rotate(3deg);
    }
    50%{
        transform:translate(-5px,-20px) rotate(-2deg);
    }
    75%{
        transform:translate(-9px,-9px) rotate(4deg);
    }
}

/* message is positioned by JS at exact balloon location */
.balloon-message{
    position:fixed;
    width:205px;
    padding:14px 16px;

    background:rgba(255,255,255,.98);
    border:1px solid rgba(255,255,255,.95);
    border-radius:18px;

    color:#b72e63;
    font-family:Georgia,"Times New Roman",serif;
    font-size:14px;
    line-height:1.45;

    box-shadow:0 18px 45px rgba(85,30,55,.18);

    opacity:0;
    pointer-events:none;
    z-index:999;

    transform:translate(-50%,0) scale(.35);
    transition:
        opacity .4s ease,
        transform .65s cubic-bezier(.16,1,.3,1);
}

.balloon-message:after{
    content:"";
    position:absolute;
    bottom:-9px;
    left:50%;
    transform:translateX(-50%);
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:10px solid white;
}

.balloon-message.active{
    opacity:1;
    transform:translate(-50%,-105px) scale(1);
}

.balloon.bursting{
    animation:none;
    transform:scale(1.18);
}

.balloon.gone{
    opacity:0;
    transform:scale(.05);
    pointer-events:none;
}

.balloon-counter{
    display:inline-block;
    padding:7px 17px;
    border-radius:30px;
    background:rgba(255,255,255,.75);
    color:#87616f;
    font-size:11px;
}

/* =========================
   BURST
========================= */

.burst-piece{
    position:fixed;
    z-index:1000;
    pointer-events:none;
    font-size:15px;
    animation:burstPiece .75s ease-out forwards;
}

@keyframes burstPiece{
    0%{
        opacity:1;
        transform:translate(0,0) rotate(0) scale(1);
    }
    100%{
        opacity:0;
        transform:
            translate(var(--x),var(--y))
            rotate(500deg)
            scale(.2);
    }
}

/* =========================
   CAKE
========================= */

.oyeee{
    min-height:82px;
    margin-bottom:4px;
    font-family:Georgia,"Times New Roman",serif;
    color:#b52e62;
}

.oyeee-line{
    display:block;
    opacity:0;
    transform:translateY(10px) scale(.95);
    animation:oyeeIn .65s forwards;
}

.oyeee-line:nth-child(1){animation-delay:.1s}
.oyeee-line:nth-child(2){animation-delay:.65s}
.oyeee-line:nth-child(3){
    animation-delay:1.2s;
    font-size:20px;
    font-weight:bold;
}
.oyeee-line:nth-child(4){
    animation-delay:1.8s;
    color:#765967;
    font-size:14px;
}

@keyframes oyeeIn{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.cake-heading{
    font-size:clamp(39px,11vw,58px);
}

.cake{
    position:relative;
    width:280px;
    height:235px;
    margin:-3px auto -4px;
}

.plate{
    position:absolute;
    width:270px;
    height:24px;
    left:5px;
    bottom:22px;
    background:#dfa4b8;
    border-radius:50%;
}

.cake-body{
    position:absolute;
    width:215px;
    height:105px;
    left:32px;
    bottom:42px;
    background:linear-gradient(#f7b4ca,#df7fa5);
    border-radius:15px 15px 25px 25px;
}

.frosting{
    position:absolute;
    width:215px;
    height:43px;
    top:-16px;
    background:#fffafd;
    border-radius:50%;
}

.cake-number{
    position:absolute;
    width:100%;
    top:35px;
    font-family:Georgia,serif;
    font-size:37px;
    font-weight:bold;
    color:#b42b5d;
}

.candle{
    position:absolute;
    width:16px;
    height:65px;
    bottom:143px;
    z-index:5;
    border-radius:5px;

    background:
        repeating-linear-gradient(
            135deg,
            white 0 8px,
            #ef8bab 8px 16px
        );
}

.candle1{left:88px}
.candle2{left:132px}
.candle3{left:176px}

.flame{
    position:absolute;
    width:20px;
    height:29px;
    bottom:205px;
    z-index:7;

    background:linear-gradient(#fff36b,#ff8c20);
    border-radius:60% 40% 60% 40%;

    opacity:1;

    filter:
        brightness(1)
        drop-shadow(0 0 9px rgba(255,170,40,.85));

    animation:flameFlicker .55s ease-in-out infinite alternate;

    transition:
        opacity .1s,
        filter .1s;
}

.flame1{left:86px}
.flame2{left:130px}
.flame3{left:174px}

@keyframes flameFlicker{
    from{transform:rotate(5deg) scale(1)}
    to{transform:rotate(-6deg) scale(.9)}
}

.flame.off{
    opacity:0!important;
    filter:none!important;
    animation:none!important;
}

.wind-label{
    font-size:13px;
    font-weight:bold;
    color:#6d4656;
}

#wind{
    width:min(90%,380px);
    margin-top:7px;
    accent-color:#c63168;
    cursor:pointer;
}

#windValue{
    margin-top:3px;
    color:#98727f;
    font-size:11px;
}

/* =========================
   CANDLES DONE
========================= */

.candle-message h1{
    font-size:clamp(48px,13vw,72px);
    line-height:.9;
}

.candle-message p{
    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
    line-height:1.7;
}

/* =========================
   GIFT
========================= */

.gift-heading{
    font-size:clamp(38px,11vw,58px);
    line-height:1;
}

.sunflower{
    position:relative;
    width:125px;
    height:130px;
    margin:0 auto -2px;
    animation:flowerFloat 3s ease-in-out infinite;
}

@keyframes flowerFloat{
    0%,100%{
        transform:translateY(0) rotate(0);
    }
    50%{
        transform:translateY(-5px) rotate(2deg);
    }
}

.petal{
    position:absolute;
    width:40px;
    height:58px;
    left:43px;
    top:22px;
    background:#ffca2d;
    border-radius:50%;
    transform-origin:20px 39px;
}

.petal:nth-child(1){transform:rotate(0deg) translateY(-24px)}
.petal:nth-child(2){transform:rotate(45deg) translateY(-24px)}
.petal:nth-child(3){transform:rotate(90deg) translateY(-24px)}
.petal:nth-child(4){transform:rotate(135deg) translateY(-24px)}
.petal:nth-child(5){transform:rotate(180deg) translateY(-24px)}
.petal:nth-child(6){transform:rotate(225deg) translateY(-24px)}
.petal:nth-child(7){transform:rotate(270deg) translateY(-24px)}
.petal:nth-child(8){transform:rotate(315deg) translateY(-24px)}

.flower-center{
    position:absolute;
    width:52px;
    height:52px;
    left:37px;
    top:38px;
    background:#6d3d20;
    border-radius:50%;
    z-index:3;
}

.flower-stem{
    position:absolute;
    width:7px;
    height:72px;
    left:62px;
    top:80px;
    background:#5b8b4e;
    border-radius:10px;
}

/* =========================
   KITKAT
========================= */

.kitkat{
    position:relative;
    width:210px;
    height:72px;
    margin:-5px auto 4px;
    animation:kitkatFloat 3s ease-in-out infinite;
}

@keyframes kitkatFloat{
    50%{
        transform:translateY(-4px) rotate(1deg);
    }
}

.kitkat-wrapper{
    position:absolute;
    width:190px;
    height:68px;
    left:10px;
    top:2px;

    border-radius:9px;
    transform:rotate(-3deg);

    background:linear-gradient(145deg,#ef333d,#ad0d1c);
    box-shadow:0 12px 24px rgba(80,0,10,.18);
}

.kitkat-border{
    position:absolute;
    inset:5px;
    border:2px solid white;
    border-radius:6px;
}

.kitkat-logo{
    position:absolute;
    width:130px;
    height:31px;
    left:30px;
    top:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:white;
    border-radius:50%;

    color:#c91c29;
    font-family:Georgia,serif;
    font-size:19px;
    font-weight:bold;
}

.wafer{
    position:absolute;
    width:132px;
    height:9px;
    left:29px;
    bottom:-7px;

    background:
        repeating-linear-gradient(
            90deg,
            #d69a65 0 8px,
            #b87348 8px 11px
        );

    border-radius:5px;
}

.gift-card{
    padding:12px 16px;
    background:rgba(255,255,255,.82);
    border:1px solid rgba(255,255,255,.9);
    border-radius:20px;
    box-shadow:0 15px 35px rgba(70,30,50,.08);
}

.gift-card p{
    margin:5px 0;
    font-size:12px;
    line-height:1.5;
}

.gift-card strong{
    color:#c33068;
}

/* =========================
   LETTER
========================= */

.letter{
    position:relative;
    z-index:10;

    width:min(94%,550px);
    max-height:89vh;

    overflow-y:auto;

    padding:30px 25px;

    background:linear-gradient(145deg,#fffdf9,#fff8ed);

    text-align:left;

    border-radius:4px;

    box-shadow:0 25px 65px rgba(70,30,40,.15);
}

.letter:before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(180,120,130,.18);
    pointer-events:none;
}

.letter h1{
    position:relative;
    z-index:2;
    margin-bottom:20px;
    font-size:42px;
}

.letter p{
    position:relative;
    z-index:2;
    margin:0 0 15px;

    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
    line-height:1.75;
}

.signature{
    color:#c33068;
    font-weight:bold;
}

/* =========================
   FINAL
========================= */

.final-number{
    margin-top:8px;

    font-family:Georgia,serif;
    font-size:clamp(100px,28vw,145px);
    line-height:.8;

    color:#d03a70;

    text-shadow:
        8px 8px rgba(255,185,207,.7);
}

.final h1{
    margin-top:27px;
    font-size:clamp(36px,10vw,50px);
    line-height:1.05;
}

.final p{
    font-size:15px;
    line-height:1.7;
}

.final-highlight{
    color:#c32e67;
    font-weight:bold;
}

/* =========================
   CONFETTI
========================= */

.confetti{
    position:fixed;
    top:-25px;
    z-index:9999;
    pointer-events:none;
    animation:confettiFall 3s linear forwards;
}

@keyframes confettiFall{
    0%{
        opacity:1;
        transform:translateY(0) rotate(0);
    }
    100%{
        opacity:0;
        transform:translateY(110vh) rotate(720deg);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:430px){

    .page{
        padding:12px;
    }

    .balloon-stage{
        height:365px;
    }

    .balloon{
        width:61px;
        height:80px;
    }

    .balloon1{
        left:3%;
        top:60px;
    }

    .balloon2{
        left:39%;
        top:10px;
    }

    .balloon3{
        right:3%;
        top:63px;
